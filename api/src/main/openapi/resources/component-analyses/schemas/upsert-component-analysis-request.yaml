type: object
properties:
  project_uuid:
    type: string
    format: uuid
    description: UUID of the project the component belongs to
  purl:
    type: string
    description: Canonical package URL identifying the component
  group:
    type: string
  name:
    type: string
  version:
    type: string
  license:
    type: string
    description: |-
      SPDX license ID or custom license name of one resolved license.
      At most one of license, license_expression and license_name may be set;
      none clears the override.
  license_expression:
    type: string
    description: |-
      SPDX license expression of more than one license; each license, also on
      the left of WITH, must be a known SPDX ID or custom license name.
      Curates a multi-license as a whole. A single license goes into license.
  license_name:
    type: string
    description: Free-text license name, for a value no known license can express
  details:
    type: string
    description: Free-text curation note, written onto the component
required:
  - project_uuid
  - name
